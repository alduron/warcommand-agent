name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: warcommand-agent

jobs:
  build:
    # Windows only. Five of the eight assemblies target net8.0-windows and the test project
    # references the Vosk native package, so a linux runner cannot build this solution at all.
    runs-on: windows-latest
    steps:
      # Checked out into warcommand-agent/ rather than the workspace root, because three tests
      # read the shared parse spec out of the SIBLING repo by walking up from the solution. That
      # is the umbrella layout, and CI has to reproduce it or those tests cannot run.
      - uses: actions/checkout@v4
        with:
          path: warcommand-agent

      # warcommand-api is private, so the default GITHUB_TOKEN cannot see it. CONTRACTS_REPO_KEY
      # is a read-only DEPLOY KEY for that one repo, not a personal token: it can read exactly
      # this repository and nothing else, and revoking it is deleting one key.
      # Only the fixture directory is fetched.
      - name: Check out the shared parse spec
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: alduron/warcommand-api
          path: warcommand-api
          sparse-checkout: tests/unit/fixtures
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.CONTRACTS_REPO_KEY }}

      # Fails here with the reason rather than 40 lines into a test stack trace.
      - name: Confirm the parse spec is present
        shell: bash
        run: |
          if [ ! -f ../warcommand-api/tests/unit/fixtures/utterances.yaml ]; then
            echo "::error::utterances.yaml is missing. CONTRACTS_REPO_KEY must be a read-only deploy key for alduron/warcommand-api."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WarCommand.Agent.sln

      # Directory.Build.props sets TreatWarningsAsErrors, so this is the analyzer gate too.
      - name: Build
        run: dotnet build WarCommand.Agent.sln -c Release --no-restore

      - name: Test
        run: dotnet test WarCommand.Agent.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: warcommand-agent/**/TestResults/*.trx
          if-no-files-found: ignore
