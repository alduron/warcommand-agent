name: release

# One tag ships the agent. Nothing else is touched: the API reads agent-release.json from this
# release's `latest` URL, and warcommand.app/download renders whatever that says.
#
#   git tag v1.4.0 && git push origin v1.4.0
#
# See RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (dry run, publishes nothing)'
        required: true

permissions:
  contents: write

# One release at a time. Two tags pushed close together both write the same `latest` pointer that
# the API polls, and the loser wins silently. Never cancel one in flight: a half-published release
# leaves an installer with no manifest beside it.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: warcommand-agent

jobs:
  release:
    runs-on: windows-latest
    # A hung test used to run until somebody noticed: a release sat on "Test" for an hour
    # and fifty minutes and the CI run before it was cancelled by hand at three hours. The
    # whole suite finishes in eight seconds, so anything past this is a hang, not slowness.
    timeout-minutes: 20
    steps:
      # Checked out into warcommand-agent/ rather than the workspace root: three tests read the
      # shared parse spec out of the SIBLING repo by walking up from the solution. That is the
      # umbrella layout, and this job has to reproduce it or those tests cannot run.
      - uses: actions/checkout@v4
        with:
          path: warcommand-agent

      # warcommand-api is private, so the default GITHUB_TOKEN cannot see it. CONTRACTS_REPO_KEY
      # is a read-only DEPLOY KEY for that one repo, not a personal token: it can read exactly
      # this repository and nothing else, and revoking it is deleting one key.
      # Only the fixture directory is fetched.
      - name: Check out the shared parse spec
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: alduron/warcommand-api
          path: warcommand-api
          sparse-checkout: tests/unit/fixtures
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.CONTRACTS_REPO_KEY }}

      # The generated near-floor pair list lives only in the umbrella, and the parser degrades
      # without it: two IntentParser rows resolve differently. Sparse, read-only, same deploy-key
      # pattern as above.
      - name: Check out the generated contracts
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: alduron/warcommand
          path: _umbrella
          sparse-checkout: contracts/generated
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.UMBRELLA_REPO_KEY }}

      # ContractFixtures walks UP from the test binary looking for these paths, so they have to sit
      # at the workspace root beside warcommand-agent/ and warcommand-api/, not under _umbrella/.
      - name: Place the generated contracts
        shell: bash
        working-directory: .
        run: |
          # Tolerant on purpose. If the umbrella checkout was skipped, dying here with a raw `cp`
          # error hides the reason; the next step names the missing deploy key instead.
          mkdir -p contracts
          if [ -d _umbrella/contracts/generated ]; then
            cp -r _umbrella/contracts/generated contracts/generated
          else
            echo "the umbrella checkout produced nothing; the next step reports why"
          fi

      - name: Confirm the parse spec is present
        shell: bash
        run: |
          if [ ! -f ../warcommand-api/tests/unit/fixtures/utterances.yaml ]; then
            echo "::error::utterances.yaml is missing. CONTRACTS_REPO_KEY must be a read-only deploy key for alduron/warcommand-api."
            exit 1
          fi
          if [ ! -f ../contracts/generated/near-floor-pairs.json ]; then
            echo "::error::near-floor-pairs.json is missing. UMBRELLA_REPO_KEY must be a read-only deploy key for alduron/warcommand."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          # Resolved from the WORKSPACE root, not the job's working-directory: this repo is
          # checked out into warcommand-agent/ so the sibling repos can sit beside it.
          global-json-file: warcommand-agent/global.json

      # The tag is the single source of the version. Nothing in the repo carries it, so a release
      # cannot disagree with its own tag, and a rebuild of the same tag is byte-for-byte the same
      # decision.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "version '$version' is not MAJOR.MINOR.PATCH" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "setup=WarCommand-Setup-$version.exe" >> $env:GITHUB_OUTPUT

      # Three attempts, because this is the one step that reaches nuget.org and a transient 5xx
      # there has nothing to do with the code being released.
      - name: Restore
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if dotnet restore WarCommand.Agent.sln; then exit 0; fi
            echo "restore attempt $attempt failed"
            sleep $((attempt * 15))
          done
          echo "::error::dotnet restore failed three times. nuget.org, not this repo."
          exit 1

      - name: Build
        run: dotnet build WarCommand.Agent.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      # A release that has not passed its own tests is the failure this step exists to prevent.
      - name: Test
        run: dotnet test WarCommand.Agent.sln -c Release --no-build --blame-hang --blame-hang-timeout 5m

      # Self-contained so no user installs a .NET runtime first, and NOT single-file: Vosk
      # P/Invokes libvosk.dll by name and the self-extract path for native libraries is the part
      # that breaks. A folder publish inside an installer has neither problem.
      - name: Publish
        run: >
          dotnet publish WarCommand.Agent/WarCommand.Agent.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -o publish/

      # sign.ps1 is a no-op with no certificate configured, so an unsigned release is a
      # deliberate default rather than a broken step. See RELEASING.md "SmartScreen".
      - name: Sign the application
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: ./installer/sign.ps1 -Path publish/WarCommand.Agent.exe

      # The runner image usually ships Inno Setup already. Reaching for Chocolatey when it is
      # right there is a network call that can rate-limit or 5xx, and it took a release down for
      # a reason that had nothing to do with the agent. Look first, install only if missing, and
      # pin the version so a new upstream release cannot change the installer under us.
      - name: Ensure Inno Setup
        id: inno
        shell: pwsh
        run: |
          # Found, never assumed. The old line hardcoded "Inno Setup 6", so the day the pin moves
          # to 7 the build would install fine and then fail looking in the wrong folder.
          function Find-Iscc {
            Get-ChildItem -Path @("${env:ProgramFiles(x86)}", $env:ProgramFiles) `
              -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup is not on the image, installing $env:INNO_VERSION."
            foreach ($attempt in 1..3) {
              choco install innosetup --version=$env:INNO_VERSION --no-progress -y
              $iscc = Find-Iscc
              if ($iscc) { break }
              Write-Host "attempt $attempt failed"
              Start-Sleep -Seconds ($attempt * 15)
            }
          }
          if (-not $iscc) {
            Write-Host "::error::Inno Setup could not be installed after three attempts. Chocolatey, not this repo."
            exit 1
          }
          Write-Host "ISCC: $iscc"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT
        env:
          INNO_VERSION: '6.2.2'

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = '${{ steps.inno.outputs.iscc }}'
          & $iscc `
            /DAppVersion=${{ steps.version.outputs.version }} `
            /Oartifacts `
            /F"WarCommand-Setup-${{ steps.version.outputs.version }}" `
            installer/warcommand.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Sign the installer
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: ./installer/sign.ps1 -Path artifacts/${{ steps.version.outputs.setup }}

      # The manifest is written AFTER signing, because signing changes the bytes and therefore the
      # digest. A checksum computed before it would be wrong on every signed release.
      - name: Write the release manifest
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $setup   = '${{ steps.version.outputs.setup }}'
          $path    = "artifacts/$setup"
          $sha     = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $notesFile = "installer/notes/$version.txt"
          if (-not (Test-Path $notesFile)) {
            New-Item -ItemType Directory -Force -Path installer/notes | Out-Null
            "WarCommand Agent $version." | Set-Content $notesFile -Encoding utf8
          }
          # Normalised to LF: the file is CRLF on a Windows runner, and the raw bytes land in
          # the JSON and in every client that renders `notes`. String.Replace on the CR code
          # point, because the backtick-escape form of this silently did not fire and 0.1.0
          # shipped with carriage returns inside the notes string.
          $notes = ((Get-Content $notesFile -Raw).Replace([string][char]13, '')).Trim()
          [ordered]@{
            version      = $version
            notes        = $notes
            url          = "https://github.com/${{ github.repository }}/releases/download/v$version/$setup"
            sha256       = $sha
            size_bytes   = (Get-Item $path).Length
            published_at = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content artifacts/agent-release.json -Encoding utf8
          Get-Content artifacts/agent-release.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.version.outputs.version }}
          path: warcommand-agent/artifacts/*

      # `releases/latest/download/agent-release.json` is the URL the API polls, and GitHub points
      # it at whichever release is newest. A prerelease is excluded from `latest`, which is exactly
      # the behaviour wanted: tag a prerelease and nobody's download page moves.
      - name: Publish the GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: WarCommand Agent ${{ steps.version.outputs.version }}
          body_path: warcommand-agent/installer/notes/${{ steps.version.outputs.version }}.txt
          fail_on_unmatched_files: true
          files: |
            warcommand-agent/artifacts/${{ steps.version.outputs.setup }}
            warcommand-agent/artifacts/agent-release.json
